name: Contract smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Run contract smoke checks
        run: php tests/contract-smoke.php
      - name: Exercise POS HTTP contract
        shell: bash
        run: |
          rm -rf app/storage
          php -v
          php -S 0.0.0.0:8080 -t "$GITHUB_WORKSPACE/app/public" "$GITHUB_WORKSPACE/app/public/index.php" >/tmp/pos.log 2>&1 &
          server_pid=$!
          sleep 2
          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat /tmp/pos.log
            exit 1
          fi
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/api/v1/health >/tmp/health.json; then
            cat /tmp/pos.log
            exit 1
          fi
          test "$(cat /tmp/health.json)" = '{"status":"ok","service":"pos-order"}'
          sale='{"occurredAt":"2026-11-01T00:00:00Z","items":[{"productId":"prod-beras-5kg","quantity":2,"unitPrice":12000}],"payment":{"method":"cash"}}'
          status=$(curl -sS -o /tmp/sale.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$sale" http://127.0.0.1:8080/api/v1/sales)
          if [ "$status" != 201 ]; then
            cat /tmp/sale.json
            cat /tmp/pos.log
            exit 1
          fi
          status=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"occurredAt":"2026-11-01T00:00:00Z","items":[{"productId":"prod-beras-5kg","quantity":0,"unitPrice":12000}],"payment":{"method":"cash"}}' http://127.0.0.1:8080/api/v1/sales)
          test "$status" = 422
          order='{"externalMessageId":"wa-ci-1","receivedAt":"2026-11-01T00:00:00Z","items":[{"productId":"prod-gula-1kg","quantity":1}]}'
          curl -fsS -o /tmp/order-1.json -H 'Content-Type: application/json' -H 'Idempotency-Key: wa-ci-1' -d "$order" http://127.0.0.1:8080/api/v1/orders/whatsapp
          curl -fsS -o /tmp/order-2.json -H 'Content-Type: application/json' -H 'Idempotency-Key: wa-ci-1' -d "$order" http://127.0.0.1:8080/api/v1/orders/whatsapp
          test "$(php -r 'echo count(json_decode(file_get_contents("app/storage/orders.json"), true));')" = 1
      - name: Exercise POS to inventory to procurement flow
        shell: bash
        run: |
          rm -rf app/storage
          mkdir -p app/storage
          cat > app/storage/events.ndjson <<'EOF'
          {"eventId":"event-ci-1","eventType":"SaleRecorded","schemaVersion":1,"occurredAt":"2026-11-01T00:00:00Z","saleId":"sale-ci-1","currency":"IDR","items":[{"productId":"prod-beras-5kg","quantity":2}]}
          EOF
          php services/inventory/consumer.php
          test "$(php -r 'echo json_decode(file_get_contents("app/storage/inventory.json"), true)["prod-beras-5kg"];')" = "-2"
          php services/procurement/export.php
          test -n "$(find app/storage/exports -name 'procurement-*.csv' -print -quit)"
